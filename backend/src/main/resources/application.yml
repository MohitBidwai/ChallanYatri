spring:
  application:
    name: challanyatri
  datasource:
    url: ${DB_URL:jdbc:h2:mem:challanyatri;DB_CLOSE_DELAY=-1;MODE=MySQL}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    open-in-view: false

server:
  port: ${SERVER_PORT:8080}

app:
  cors:
    allowed-origin: ${APP_CORS_ALLOWED_ORIGIN:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET:change-this-development-secret-key-please-use-32-chars}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
